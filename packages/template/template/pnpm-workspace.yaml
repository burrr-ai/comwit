onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - sharp
  - unrs-resolver
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  unrs-resolver: true
# Pinned kit versions are often younger than pnpm's minimumReleaseAge.
minimumReleaseAgeExclude:
  - 'next'
  - '@next/env'
  - '@next/swc-darwin-arm64'
  - '@next/swc-darwin-x64'
  - '@next/swc-linux-arm64-gnu'
  - '@next/swc-linux-arm64-musl'
  - '@next/swc-linux-x64-gnu'
  - '@next/swc-linux-x64-musl'
  - '@next/swc-win32-arm64-msvc'
  - '@next/swc-win32-x64-msvc'
  - '@comwit/state'
  - '@comwit/ui'
  - '@comwit/ui-templates'
  - 'comwit-ui'
  - '@ssgoi/core'
  - '@ssgoi/react'
