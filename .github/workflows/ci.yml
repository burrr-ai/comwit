name: CI
on:
  pull_request:
  push:
    branches: [latest]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter docs lint
      - run: pnpm --filter storybook build
      - run: pnpm --filter ui-dev build
      - run: pnpm --filter state-playground build
